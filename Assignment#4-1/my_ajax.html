<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie CRUD</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
  </head>
  <body>
    <h1>영화 목록</h1>
    <div id="div_list"></div>
    <button id="btn_list">목록 보기</button>

    <hr />

    <!-- 영화 정보 입력 영역 -->
    <div>
      id:
      <input type="text" id="input_id" />

      title:
      <input type="text" id="input_title" />

      director:
      <input type="text" id="input_director" />

      year:
      <input type="number" id="input_year" />

      rating:
      <input type="number" step="0.1" id="input_rating" />
    </div>

    <button id="btn_add">입력하기</button>
    <button id="btn_update">수정하기</button>
    <button id="btn_delete">삭제하기</button>
    <button id="btn_detail">조회하기</button>

    <script>
      const BASE_URL = "http://localhost:3000/movies";

      $(function () {
        -(
          //조회 (Detail)

          $("#btn_detail").click(function () {
            alert("detail movie?");

            const id = $("#input_id").val();
            if (!id) {
              alert("조회할 영화의 id를 입력하세요.");
              return;
            }

            const xhr = new XMLHttpRequest();
            xhr.open("GET", BASE_URL + "/" + id);
            xhr.setRequestHeader("content-type", "application/json");
            xhr.send();
            xhr.onload = () => {
              if (xhr.status === 200) {
                let res = JSON.parse(xhr.response);
                alert(JSON.stringify(res));

                // 조회한 값 input에 채워넣기 (편하게 수정할 수 있게)
                $("#input_title").val(res.title || "");
                $("#input_director").val(res.director || "");
                $("#input_year").val(res.year || "");
                $("#input_rating").val(res.rating || "");
              } else {
                console.log(xhr.status, xhr.statusText);
                alert("조회 실패");
              }
            };
          })
        );

        // 삭제(Delete)

        $("#btn_delete").click(function () {
          alert("delete movie?");

          const id = $("#input_id").val();
          if (!id) {
            alert("삭제할 영화의 id를 입력하세요.");
            return;
          }

          const xhr = new XMLHttpRequest();
          xhr.open("DELETE", BASE_URL + "/" + id);
          xhr.setRequestHeader("content-type", "application/json");
          xhr.send();
          xhr.onload = () => {
            if (xhr.status === 200) {
              let res = JSON.parse(xhr.response);
              alert("삭제 완료: " + JSON.stringify(res));
            } else {
              console.log(xhr.status, xhr.statusText);
              alert("삭제 실패");
            }
          };
        });

        //수정
        $("#btn_update").click(function () {
          alert("update movie?");

          const id = $("#input_id").val();
          if (!id) {
            alert("수정할 영화의 id를 입력하세요.");
            return;
          }

          let data = {
            title: $("#input_title").val(),
            director: $("#input_director").val(),
            year: Number($("#input_year").val()),
            rating: Number($("#input_rating").val()),
          };

          const xhr = new XMLHttpRequest();
          xhr.open("PATCH", BASE_URL + "/" + id); // PUT 대신 PATCH
          xhr.setRequestHeader("content-type", "application/json");
          xhr.send(JSON.stringify(data));
          xhr.onload = () => {
            if (xhr.status === 200) {
              let res = JSON.parse(xhr.response);
              alert("수정 완료: " + JSON.stringify(res));
            } else {
              console.log(xhr.status, xhr.statusText);
              alert("수정 실패");
            }
          };
        });

        //추가
        $("#btn_add").click(function () {
          alert("add movie?");

          let data = {
            title: $("#input_title").val(),
            director: $("#input_director").val(),
            year: Number($("#input_year").val()),
            rating: Number($("#input_rating").val()),
            created_date: new Date().toISOString().slice(0, 10), // "YYYY-MM-DD"
          };

          const xhr = new XMLHttpRequest();
          xhr.open("POST", BASE_URL);
          xhr.setRequestHeader("content-type", "application/json");
          xhr.send(JSON.stringify(data));
          xhr.onload = () => {
            if (xhr.status === 201 || xhr.status === 200) {
              let res = JSON.parse(xhr.response);
              alert("추가 완료: " + JSON.stringify(res));
            } else {
              console.log(xhr.status, xhr.statusText);
              alert("추가 실패");
            }
          };
        });

        //목록
        $("#btn_list").click(function () {
          alert("get movies?");

          const xhr = new XMLHttpRequest();
          xhr.open("GET", BASE_URL);
          xhr.setRequestHeader("content-type", "application/json");
          xhr.send();
          xhr.onload = () => {
            if (xhr.status === 200) {
              let res = JSON.parse(xhr.response);
              $("#div_list").html("");
              res.forEach(function (each) {
                $("#div_list").append(
                  `<div>${each.id} : ${each.title} / ${each.director} (${each.year}) [${each.rating}]</div>`
                );
              });
            } else {
              console.log(xhr.status, xhr.statusText);
              alert("목록 조회 실패");
            }
          };
        });
      });
    </script>
  </body>
</html>
